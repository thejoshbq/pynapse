[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynapse"
version = "0.1.0"
description = "A Python library for neural data analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Josh Boquiren", email = "thejoshbq@proton.me"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typing-extensions",
    "duckdb>=1.0.0",
    "asttokens==3.0.0",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "decorator==5.2.1",
    "executing==2.2.0",
    "fonttools==4.59.1",
    "ipython==9.4.0",
    "ipython_pygments_lexers==1.1.1",
    "jedi==0.19.2",
    "joblib==1.5.1",
    "kiwisolver==1.4.9",
    "matplotlib==3.10.5",
    "matplotlib-inline==0.1.7",
    "narwhals==2.2.0",
    "numpy==2.3.1",
    "packaging==25.0",
    "pandas==2.3.2",
    "parso==0.8.5",
    "pillow==11.3.0",
    "plotly==6.2.0",
    "prompt_toolkit==3.0.51",
    "pure_eval==0.2.3",
    "Pygments==2.19.2",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "scikit-learn==1.7.1",
    "scipy==1.16.0",
    "seaborn==0.13.2",
    "six==1.17.0",
    "stack-data==0.6.3",
    "threadpoolctl==3.6.0",
    "tqdm==4.67.1",
    "traitlets==5.14.3",
    "tzdata==2025.2",
    "wcwidth==0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pynapse*"]
exclude = [".venv*", "data*", "tests*", "*.tests*", "*.tests", "__pycache__", "*.pyc"]
